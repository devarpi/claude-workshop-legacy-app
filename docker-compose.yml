services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: legacy-dynamodb-local
    ports:
      - "8010:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: legacy-dynamodb-admin
    ports:
      - "8011:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
